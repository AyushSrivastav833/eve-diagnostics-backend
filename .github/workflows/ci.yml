name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eve
          POSTGRES_USER: eve
          POSTGRES_PASSWORD: eve
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://eve:eve@localhost:5432/eve
      DB_CONN_MAX_AGE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yaml
      - name: Tests (PostgreSQL, incl. concurrency tests)
        run: pytest --cov --cov-report=term-missing
